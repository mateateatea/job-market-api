<div class="page">
  <header class="page-header">
    <h1>Job Listings</h1>
    <p class="subtitle">Browse and add jobs from the Poznań IT market dataset</p>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <app-add-job-form (jobAdded)="onJobAdded()"></app-add-job-form>
    </aside>

    <main class="content">
      <table class="job-table">
        <thead>
        <tr>
          <th>Title</th>
          <th>Company</th>
          <th>City</th>
          <th>Work Model</th>
          <th>Seniority</th>
          <th>Skills</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let job of jobs()">
          <td>{{ job.title }}</td>
          <td>{{ job.company?.name }}</td>
          <td>{{ job.city }}</td>
          <td><span class="badge badge-{{ job.workModel }}">{{ job.workModel }}</span></td>
          <td><span class="badge badge-{{ job.seniority }}">{{ job.seniority }}</span></td>
          <td class="skills-cell">{{ job.skills.map(s => s.name).join(', ') }}</td>
        </tr>
        </tbody>
      </table>
    </main>
  </div>
</div>
